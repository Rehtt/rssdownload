name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag and extract release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${TAG_NAME}" =~ ${tag_pattern} ]]; then
            echo "::error title=Invalid release tag::Expected vX.Y.Z or vX.Y.Z-prerelease, got ${TAG_NAME}"
            exit 1
          fi

          heading="## ${TAG_NAME}"
          heading_count="$(grep -Fxc -- "${heading}" CHANGELOG.md || true)"
          if [[ "${heading_count}" -ne 1 ]]; then
            echo "::error title=Invalid changelog::Expected exactly one '${heading}' heading, found ${heading_count}"
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="${heading}" '
            $0 == heading {
              found = 1
              next
            }
            found && /^## / {
              exit
            }
            found {
              if (!started && $0 ~ /^[[:space:]]*$/) {
                next
              }
              started = 1
              lines[++line_count] = $0
            }
            END {
              while (line_count > 0 && lines[line_count] ~ /^[[:space:]]*$/) {
                line_count--
              }
              for (line_number = 1; line_number <= line_count; line_number++) {
                print lines[line_number]
              }
              if (!found || line_count == 0) {
                exit 1
              }
            }
          ' CHANGELOG.md > "${notes_file}" || {
            echo "::error title=Empty changelog section::${heading} must contain release notes"
            exit 1
          }

          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"
          if [[ "${TAG_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare build metadata
        id: build_metadata
        shell: bash
        run: |
          set -euo pipefail

          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "BUILD_TIME=${build_time}" >> "${GITHUB_ENV}"
          echo "build_time=${build_time}" >> "${GITHUB_OUTPUT}"
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run tests
        run: make test

      - name: Build WebUI
        run: pnpm --dir web build

      - name: Build and verify release assets
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ldflags="-s -w -X main.version=${TAG_NAME} -X main.commit=${COMMIT_SHA} -X main.buildTime=${BUILD_TIME}"
          mkdir -p release

          for arch in amd64 arm64; do
            archive_name="rssdownload_${TAG_NAME}_linux_${arch}"
            staging_dir="${RUNNER_TEMP}/${archive_name}"
            mkdir -p "${staging_dir}"

            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build \
                -buildvcs=false \
                -trimpath \
                -ldflags "${ldflags}" \
                -o "${staging_dir}/rssdownload" \
                ./cmd/rssdownload

            tar -C "${staging_dir}" -czf "release/${archive_name}.tar.gz" rssdownload
          done

          expected_version="rssdownload ${TAG_NAME} (commit ${COMMIT_SHA}, built ${BUILD_TIME})"
          actual_version="$("${RUNNER_TEMP}/rssdownload_${TAG_NAME}_linux_amd64/rssdownload" version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error title=Invalid version metadata::Expected '${expected_version}', got '${actual_version}'"
            exit 1
          fi

          (
            cd release
            sha256sum *.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: container_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.build_metadata.outputs.image_name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container_metadata.outputs.tags }}
          labels: ${{ steps.container_metadata.outputs.labels }}
          annotations: ${{ steps.container_metadata.outputs.annotations }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_metadata.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published container image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ steps.build_metadata.outputs.image_name }}
        run: |
          set -euo pipefail

          image_ref="${IMAGE_NAME}:${TAG_NAME}"
          expected_version="rssdownload ${TAG_NAME} (commit ${COMMIT_SHA}, built ${BUILD_TIME})"
          actual_version="$(docker run --rm --platform linux/amd64 "${image_ref}" version)"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "::error title=Invalid container version metadata::Expected '${expected_version}', got '${actual_version}'"
            exit 1
          fi

          manifest="$(docker buildx imagetools inspect "${image_ref}")"
          grep -F "linux/amd64" <<< "${manifest}"
          grep -F "linux/arm64" <<< "${manifest}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          release_options=(
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --title "RSSDownload ${TAG_NAME}"
            --notes-file "${NOTES_FILE}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_options+=(--prerelease --latest=false)
          fi

          gh release create "${TAG_NAME}" release/* "${release_options[@]}"
